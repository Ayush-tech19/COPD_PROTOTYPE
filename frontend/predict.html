<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COPD Risk Prediction</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand">🫁 COPD Care</a>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="predict.html">Prediction</a>
    <a href="doctor.html">Find Doctor</a>
  </nav>
</header>

<main class="container">
  <div class="dashboard-header">
    <h1>COPD Risk Prediction</h1>
    <p>Neeche diye gaye 13 parameters bharo aur risk score check karo</p>
  </div>

  <div class="form-card">
    <form id="predictForm">
      <div class="form-grid">

        <div class="field">
          <label for="age">Age (years)</label>
          <input type="number" id="age" min="1" max="120" required>
        </div>

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="smoking_status">Smoking Status</label>
          <select id="smoking_status" required>
            <option value="never">Never smoked</option>
            <option value="former">Former smoker</option>
            <option value="current">Current smoker</option>
          </select>
        </div>

        <div class="field">
          <label for="pack_years">Pack-Years</label>
          <input type="number" id="pack_years" min="0" step="0.1" value="0" required>
          <small>0 agar kabhi smoke nahi kiya</small>
        </div>

        <div class="field">
          <label for="fev1_percent">FEV1 % Predicted</label>
          <input type="number" id="fev1_percent" min="0" max="150" step="0.1" required>
          <small>Spirometry report se</small>
        </div>

        <div class="field">
          <label for="fev1_fvc_ratio">FEV1/FVC Ratio</label>
          <input type="number" id="fev1_fvc_ratio" min="0" max="1" step="0.01" placeholder="e.g. 0.65" required>
        </div>

        <div class="field">
          <label for="mmrc_dyspnea_scale">mMRC Dyspnea Scale (0-4)</label>
          <input type="number" id="mmrc_dyspnea_scale" min="0" max="4" required>
        </div>

        <div class="field">
          <label for="respiratory_infections_last_year">Chest Infections (last 12 months)</label>
          <input type="number" id="respiratory_infections_last_year" min="0" value="0" required>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="biomass_fuel_exposure">
          <label for="biomass_fuel_exposure">Biomass fuel exposure (chulha/wood smoke)</label>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="occupational_dust_exposure">
          <label for="occupational_dust_exposure">Occupational dust/fumes exposure</label>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="chronic_cough">
          <label for="chronic_cough">Chronic cough</label>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="sputum_production">
          <label for="sputum_production">Sputum production</label>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="wheezing">
          <label for="wheezing">Wheezing</label>
        </div>

      </div>

      <button type="submit" class="btn" id="submitBtn">Predict Risk</button>
    </form>

    <div class="error-box" id="errorBox"></div>

    <div class="result-box" id="resultBox">
      <span class="result-score" id="resultScore"></span>
      <span class="result-level" id="resultLevel"></span>
      <ul class="factors-list" id="factorsList"></ul>
      <p class="disclaimer" id="disclaimerText"></p>
    </div>
  </div>
</main>
